name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (check + tests, incl. a throw-away local MongoDB)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_TEST_URI: mongodb://localhost:27017/routemind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test

  ml-service:
    name: ML service (train + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ml-service/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Generate demo dataset and train model
        run: python generate_dataset.py && python train_model.py
      - run: python -m pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images with docker compose
        env:
          # Dummy values: only needed so `docker compose` can interpolate the file. Nothing connects to Atlas in CI.
          JWT_SECRET: ci-build-only-not-a-real-secret
          MONGO_URI: mongodb+srv://ci-user:ci-password@example.invalid/?appName=ci
        run: docker compose build
