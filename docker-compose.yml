# Start everything:  cp .env.example .env  (set MONGO_URI for MongoDB Atlas + JWT_SECRET)  &&  docker compose up --build
# The database is MongoDB Atlas (external) - there is no local MongoDB container.
services:
  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      TRAFFIC_MULTIPLIERS: ${TRAFFIC_MULTIPLIERS:-LOW=1.05,MEDIUM=1.20,HIGH=1.45}
    ports:
      - "${ML_PORT:-8000}:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      ml-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI (MongoDB Atlas connection string) in .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-routemind}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example to .env first)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ML_SERVICE_URL: http://ml-service:8000
      GEOCODE_URL: ${GEOCODE_URL:-https://nominatim.openstreetmap.org/search}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      GEOCODE_USER_AGENT: ${GEOCODE_USER_AGENT:-RouteMindAI/1.0}
      GEOCODE_EMAIL: ${GEOCODE_EMAIL:-}
      ML_FALLBACK: ${ML_FALLBACK:-on}
      DIAGNOSTICS: ${DIAGNOSTICS:-on}
      GEOCODE_COUNTRY_CODES: ${GEOCODE_COUNTRY_CODES:-}
      # Empty = the built-in list of public instances (see backend/src/config.js). OVERPASS_URLS = comma-separated, in priority order.
      OVERPASS_URLS: ${OVERPASS_URLS:-}
      OVERPASS_URL: ${OVERPASS_URL:-}
      OVERPASS_USER_AGENT: ${OVERPASS_USER_AGENT:-}
      OVERPASS_TIMEOUT_MS: ${OVERPASS_TIMEOUT_MS:-20000}
      OVERPASS_BUDGET_MS: ${OVERPASS_BUDGET_MS:-45000}
      OVERPASS_MIN_INTERVAL_MS: ${OVERPASS_MIN_INTERVAL_MS:-1100}
      OVERPASS_CACHE_TTL_MS: ${OVERPASS_CACHE_TTL_MS:-86400000}
      OVERPASS_COOLDOWN_MS: ${OVERPASS_COOLDOWN_MS:-30000}
      OVERPASS_RETRIES: ${OVERPASS_RETRIES:-1}
      OVERPASS_BACKOFF_MS: ${OVERPASS_BACKOFF_MS:-1000}
      OVERPASS_ENDPOINT_COOLDOWN_MS: ${OVERPASS_ENDPOINT_COOLDOWN_MS:-30000}
      OVERPASS_ENDPOINT_COOLDOWN_MAX_MS: ${OVERPASS_ENDPOINT_COOLDOWN_MAX_MS:-300000}
      ROAD_QUALITY: ${ROAD_QUALITY:-on}
      SCENERY: ${SCENERY:-on}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      COST_PER_KM: ${COST_PER_KM:-7}
      TOLL_PER_KM: ${TOLL_PER_KM:-1.2}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
